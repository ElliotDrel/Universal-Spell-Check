<!doctype html><meta charset="utf-8"><title>USC disposable editor</title>
<style>body{font:18px system-ui;margin:40px}#editor{white-space:pre-wrap;border:1px solid #888;padding:20px;min-height:300px}</style>
<p>Disposable synthetic correction fixture</p><div id="editor" contenteditable="true"></div>
<script>
const sessionToken='__USC_SESSION__';const editor=document.querySelector('#editor'); let current=null, busy=false, pasted=false, pasteContext=null;
function selectionContext(){const s=getSelection();const describe=n=>{const path=[];for(;n&&n!==editor;n=n.parentNode)path.unshift(n.nodeType===3?'#text':n.nodeName);return {inside:n===editor,path}};return {anchor:describe(s.anchorNode),anchor_offset:s.anchorOffset,focus:describe(s.focusNode),focus_offset:s.focusOffset,collapsed:s.isCollapsed}}
function fragment(html){const a=html.indexOf('<!--StartFragment-->'),b=html.indexOf('<!--EndFragment-->');return a<0?html:html.slice(a+20,b)}
function ordinals(list){const items=[...list.children].filter(n=>n.tagName==='LI');let value=list.hasAttribute('start')?list.start:(list.reversed?items.length:1);return items.map(li=>{if(li.hasAttribute('value'))value=li.value;const n=value;value+=list.reversed?-1:1;return n})}
function shape(){const bold=[];let run='';const walker=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT);for(let n=walker.nextNode();n;n=walker.nextNode()){if(Number(getComputedStyle(n.parentElement).fontWeight)>=600)run+=n.nodeValue;else if(run){bold.push(run);run=''}}if(run)bold.push(run);return {links:[...editor.querySelectorAll('a')].map(a=>[a.textContent,a.getAttribute('href')]),bold,lists:editor.querySelectorAll('ol,ul').length,items:editor.querySelectorAll('li').length,code:[...editor.querySelectorAll('code')].map(x=>x.textContent),list_structure:[...editor.querySelectorAll('ol,ul')].map(l=>{let depth=0;for(let p=l.parentElement;p&&p!==editor;p=p.parentElement)if(p.matches('ol,ul'))depth++;const items=[...l.children].filter(n=>n.tagName==='LI');return [l.tagName.toLowerCase(),depth,items.length,l.tagName==='OL'?ordinals(l):null,items.map(li=>getComputedStyle(li).listStyleType)]})}}
function text(){if(!editor.querySelector('ol'))return editor.innerText;return [...editor.querySelectorAll('p,ol')].filter(n=>!n.closest('li')).map(n=>n.tagName==='OL'?[...n.children].map((li,i)=>`${ordinals(n)[i]}. ${li.innerText}`).join('\n'):n.innerText).join('\n\n')}
editor.addEventListener('copy',e=>{if(!current)return;e.preventDefault();e.clipboardData.setData('text/plain',current.text);if(current.html)e.clipboardData.setData('text/html',fragment(current.html))});
editor.addEventListener('paste',e=>{pasted=true;pasteContext={selection:selectionContext(),html_before:editor.innerHTML,clipboard_text:e.clipboardData.getData('text/plain'),clipboard_html:e.clipboardData.getData('text/html')};const s=getSelection();if(s.rangeCount===1){const r=s.getRangeAt(0);if(r.startContainer===editor&&r.endContainer===editor&&r.startOffset===0&&r.endOffset===editor.childNodes.length){r.deleteContents();s.removeAllRanges();s.addRange(r);pasteContext.full_document_selection_deleted=true}}});
editor.addEventListener('input',async e=>{if(!current||!pasted||busy)return;busy=true;await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));const observed={session:sessionToken,case_id:current.id,repetition:current.repetition,text:text(),selection_collapsed:getSelection().isCollapsed,html:editor.innerHTML,shape:shape(),inputType:e.inputType,paste_received:pasted,paste_context:pasteContext};await fetch('/observed',{method:'POST',body:JSON.stringify(observed)});busy=false});
async function next(){
 try{const r=await fetch('/next?session='+sessionToken);const c=await r.json();if(c&&!c.wait){current=c;pasted=false;pasteContext=null;editor.innerHTML=c.html?fragment(c.html):'';if(!c.html)editor.textContent=c.text;editor.focus();const range=document.createRange();range.selectNodeContents(editor);const selection=getSelection();selection.removeAllRanges();selection.addRange(range);await fetch('/ready',{method:'POST',body:JSON.stringify({session:sessionToken,case_id:c.id,repetition:c.repetition,shape:shape(),text:editor.innerText,selection:selectionContext(),focused:document.hasFocus()&&document.activeElement===editor})});}}
 catch(e){document.title='Fixture error: '+e.message}setTimeout(next,50)
}next();
</script>
