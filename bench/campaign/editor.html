<!doctype html><meta charset="utf-8"><title>USC disposable editor</title>
<style>body{font:18px system-ui;margin:40px}#editor{white-space:pre-wrap;border:1px solid #888;padding:20px;min-height:300px}</style>
<p>Disposable synthetic correction fixture</p><div id="editor" contenteditable="true"></div>
<script>
const editor=document.querySelector('#editor'); let current=null, busy=false, pasted=false;
function fragment(html){const a=html.indexOf('<!--StartFragment-->'),b=html.indexOf('<!--EndFragment-->');return a<0?html:html.slice(a+20,b)}
function shape(){return {links:[...editor.querySelectorAll('a')].map(a=>[a.textContent,a.getAttribute('href')]),bold:[...editor.querySelectorAll('strong,b')].map(x=>x.textContent),lists:editor.querySelectorAll('ol,ul').length,items:editor.querySelectorAll('li').length,code:[...editor.querySelectorAll('code')].map(x=>x.textContent)}}
function text(){if(!editor.querySelector('ol'))return editor.innerText;return [...editor.querySelectorAll('p,ol')].filter(n=>!n.closest('li')).map(n=>n.tagName==='OL'?[...n.children].map((li,i)=>`${i+1}. ${li.innerText}`).join('\n'):n.innerText).join('\n\n')}
editor.addEventListener('copy',e=>{if(!current)return;e.preventDefault();e.clipboardData.setData('text/plain',current.text);if(current.html)e.clipboardData.setData('text/html',fragment(current.html))});
editor.addEventListener('paste',()=>{pasted=true});
editor.addEventListener('input',async e=>{if(!current||!pasted||busy)return;busy=true;const observed={text:text(),html:editor.innerHTML,shape:shape(),inputType:e.inputType,paste_received:pasted};await fetch('/observed',{method:'POST',body:JSON.stringify(observed)});busy=false});
async function next(){
 try{const r=await fetch('/next');const c=await r.json();if(c&&!c.wait){current=c;pasted=false;editor.innerHTML=c.html?fragment(c.html):'';if(!c.html)editor.textContent=c.text;editor.focus();const range=document.createRange();range.selectNodeContents(editor);const selection=getSelection();selection.removeAllRanges();selection.addRange(range);await fetch('/ready',{method:'POST',body:JSON.stringify({shape:shape(),text:editor.innerText,focused:document.activeElement===editor})});}}
 catch(e){document.title='Fixture error: '+e.message}setTimeout(next,50)
}next();
</script>
