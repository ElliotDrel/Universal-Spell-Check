[package]
name = "universal-spell-check"
version = "0.13.3"
edition = "2024"
build = "build.rs"

[features]
default = ["dev"]
dev = []
acceptance = []
history-experiments = []

[dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["tray-notification", "message-window", "menu", "notice", "textbox", "combobox", "listbox", "rich-textbox", "high-dpi", "cursor", "frame", "embed-resource"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Security_Cryptography", "Win32_Security", "Win32_Networking_WinHttp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_Ole", "Win32_UI_Controls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
fancy-regex = "0.16"
regex = "1"
html-escape = "0.2"
time = { version = "0.3", features = ["formatting", "local-offset", "serde"] }
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"
indexmap = "2"
png = "0.18"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Accessibility"] }
velopack = "=1.2.161"

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[patch.crates-io]
native-windows-gui = { path = "vendor/native-windows-gui" }
