name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $semver = $tag.TrimStart('v')
          "semver=$semver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install pinned Rust tools
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 --manifest-path rust/Cargo.toml | ConvertFrom-Json).packages[0].version
          if ($version -ne '${{ steps.ver.outputs.semver }}') { throw "Tag and Cargo version disagree: $version" }

      - name: Format and production regressions
        shell: pwsh
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust format failed' }
          cargo clippy --locked --manifest-path rust/Cargo.toml --no-default-features --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Rust lint failed' }
          cargo test --locked --manifest-path rust/Cargo.toml --no-default-features
          if ($LASTEXITCODE -ne 0) { throw 'Rust regressions failed' }
          python -m unittest discover -s bench -p test_rust_acceptance.py
          if ($LASTEXITCODE -ne 0) { throw 'Protected-data regressions failed' }

      - name: Build and assemble production Rust app
        run: ./rust/package.ps1 -Output publish

      - name: Native startup smoke in isolated data
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'usc-release-startup-smoke'
          python -c "import subprocess; subprocess.run([r'publish\UniversalSpellCheck.exe','--startup-smoke'],check=True,timeout=30)"
          if ($LASTEXITCODE -ne 0) { throw 'Native startup smoke failed' }

      - name: Install vpk
        run: dotnet tool install --global vpk --version 1.2.161

      - name: Pack
        shell: pwsh
        run: |
          vpk pack `
            --packId UniversalSpellCheck `
            --packVersion ${{ steps.ver.outputs.semver }} `
            --packDir publish `
            --mainExe UniversalSpellCheck.exe `
            --packTitle "Universal Spell Check" `
            --runtime win-x64 `
            --channel win `
            --icon src/Assets/app.ico

      - name: Verify fresh installer before publication
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'usc-release-install-data'
          $install = Join-Path $env:RUNNER_TEMP 'usc-release-install'
          $setup = Get-ChildItem Releases -Filter '*-Setup.exe'
          if (@($setup).Count -ne 1) { throw 'Expected one Windows installer' }
          $setupProcess = Start-Process -FilePath $setup.FullName -ArgumentList @('--silent','--installto',$install) -PassThru -Wait
          if ($setupProcess.ExitCode -ne 0) { throw "Installer failed: $($setupProcess.ExitCode)" }
          $exe = [IO.Path]::GetFullPath((Join-Path $install 'current/UniversalSpellCheck.exe'))
          if ((Get-FileHash $exe).Hash -ne (Get-FileHash 'publish/UniversalSpellCheck.exe').Hash) { throw 'Installed binary differs from production build' }
          if ((Get-Item $exe).VersionInfo.ProductVersion -ne '${{ steps.ver.outputs.semver }}') { throw 'Installed version disagrees with release' }
          if (Test-Path (Join-Path $install 'current/UniversalSpellCheck.dll')) { throw 'Unexpected C# payload in Rust installer' }
          foreach ($file in @('replacements.json','licenses/native-windows-gui-MIT.txt')) {
            if (-not (Test-Path (Join-Path $install "current/$file"))) { throw "Missing installed file: $file" }
          }
          # Setup must not make a duplicate-process no-op look like a startup pass.
          Get-Process UniversalSpellCheck -ErrorAction SilentlyContinue | Where-Object Path -eq $exe | ForEach-Object {
            Stop-Process -Id $_.Id
            $_.WaitForExit()
          }
          $ready = Join-Path $env:RUNNER_TEMP 'usc-fresh-install.ready'
          python -c "import subprocess,sys; subprocess.run([sys.argv[1],'--startup-smoke','--ready-file='+sys.argv[2]],check=True,timeout=30)" $exe $ready
          if (-not (Test-Path $ready)) { throw 'Installed app did not initialize its native tray/hotkey path' }
          if ($LASTEXITCODE -ne 0) { throw 'Fresh installed app startup failed' }
          $uninstall = Start-Process -FilePath (Join-Path $install 'Update.exe') -ArgumentList @('--silent','--rootDir',$install,'uninstall') -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw 'CI installer cleanup failed' }

      - name: Upload to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          vpk upload github `
            --repoUrl ${{ github.server_url }}/${{ github.repository }} `
            --token $env:GITHUB_TOKEN `
            --tag ${{ github.ref_name }} `
            --releaseName "Universal Spell Check ${{ github.ref_name }}" `
            --publish
